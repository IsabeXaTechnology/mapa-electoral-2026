server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/geo+json;

    # index.html y rutas HTML: SIEMPRE revalidar -> cada deploy se ve al instante
    location = /index.html {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Datos y estáticos pesados (mapas, logos, capas): caché larga -> carga rápida
    location ~* \.(json|geojson|png|jpg|jpeg|svg|css|js|ico|webp)$ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
